[pytest]
testpaths = tests
pythonpath = .
# No .pytest_cache in the workspace: it is clutter in a submission, and the
# grader runs against a read-only copy.
addopts = -p no:cacheprovider
# In-cluster traffic to Qdrant is plain HTTP by design.
filterwarnings =
    ignore:Api key is used with an insecure connection
markers =
    live: calls the language model through the gateway (costs budget)
    environment: checks the platform, not your code

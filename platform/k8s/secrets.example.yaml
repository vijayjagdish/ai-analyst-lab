# Template. Copy to secrets.yaml (gitignored), fill in, and apply it BEFORE the
# rest - it is deliberately not part of kustomization.yaml so that real values
# are never rendered into a build output.
#
# These are admin credentials. They are never given to a student: a student
# receives a password for ONE database and a token for ONE collection, both
# derived by provision_student.py.
apiVersion: v1
kind: Secret
metadata:
  name: analyst-admin
  namespace: ai-data-services
type: Opaque
stringData:
  # Superuser password of the lab's PostgreSQL server.
  PG_ADMIN_PASSWORD: "CHANGE-ME"
  # Qdrant admin key; also signs every student token (HS256), so >= 32 bytes:
  #   openssl rand -base64 48
  QDRANT_ADMIN_KEY: "CHANGE-ME-TO-AT-LEAST-32-RANDOM-BYTES"
  # Student database passwords are HMAC(PROVISION_SECRET, student id). Whatever
  # service provisions students (ai-lab-api, a script) needs this same value.
  PROVISION_SECRET: "CHANGE-ME"
